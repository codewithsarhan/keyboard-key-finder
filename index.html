<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyBoard Key Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center p-4">

    <div class="flex flex-col items-center justify-center gap-6 bg-zinc-900/80 border border-zinc-800 px-10 py-12 rounded-2xl shadow-2xl text-center">
        
        <h1 class="text-xl md:text-2xl font-medium text-zinc-400 tracking-wide">
            Press Any Key to See Magic
        </h1>

        <span class="keyboardKey min-w-[140px] px-8 py-5 bg-zinc-800 border-2 border-zinc-700 border-b-4 rounded-xl text-3xl md:text-5xl font-bold text-emerald-400 shadow-lg tracking-wider">
            Press Key
        </span>

    </div>

</body>



    <script src="script.js"></script>
</body>
</html>
